<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Minimal Webapp{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: var(--aui-text, #2e3436); background: var(--app-background, #fafafa); }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--aui-action, #3584e4); text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid var(--aui-focus, #1c71d8); outline-offset: 3px; }
    .headerbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 54px; padding: 8px 16px; background: var(--app-header, #ebebeb); border-bottom: 1px solid var(--aui-border, #deddda); }
    .app-title { font-size: 15px; font-weight: 700; margin: 0; }
    .headerbar a { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; color: inherit; text-decoration: none; }
    .headerbar a:hover { background: var(--app-neutral-hover, #d5d5d5); }
    .headerbar .end { justify-self: end; }
    svg { width: 20px; height: 20px; }
    .shell { max-width: 640px; padding: 40px 24px; margin: auto; }
    h1 { font-size: 24px; letter-spacing: -.025em; margin: 0 0 8px; }
    .intro { color: var(--aui-muted-text, #5e5c64); font-size: 15px; line-height: 1.6; margin: 0 0 24px; }
    .section-title { font-size: 14px; font-weight: 700; margin: 32px 0 12px; }
    .layers { display: grid; gap: 0; }
    .layer { padding: 12px 0; border-bottom: 1px solid var(--aui-border, #deddda); font-size: 14px; }
    .layer:first-child { padding-top: 0; }
    .layer:last-child { border-bottom: 0; padding-bottom: 0; }
    .layer small { display: block; color: var(--aui-muted-text, #5e5c64); margin-top: 4px; line-height: 1.5; }
    footer { color: var(--aui-muted-text, #5e5c64); text-align: center; font-size: 12px; line-height: 1.6; padding-top: 24px; }
    @media (max-width: 420px) { .shell { padding: 28px 16px; } }
  </style>
  <script type="module" src="{{ url_for('browser', path='base.js') }}"></script>
</head>
<body>
  <header class="headerbar">
    <a href="/" aria-label="Playground" title="Playground">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
    </a>
    <p class="app-title">Minimal Webapp</p>
    <a class="end" href="/about" aria-label="How it works" title="How it works">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v2"/></svg>
    </a>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
    <footer>Local development · web-dev<br>uv · FastAPI · Jinja2 · Deno · esbuild · Adapter</footer>
  </main>
</body>
</html>
