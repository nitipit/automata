<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Skills{% endblock %} · Automata</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    html {
      color-scheme: light dark;
      background: light-dark(#f8fafc, #0f172a);
      color: light-dark(#172b4d, #e2e8f0);
      font: 16px/1.6 system-ui, sans-serif;
    }
    html[data-theme="light"] { color-scheme: light; }
    html[data-theme="dark"] { color-scheme: dark; }
    skill-page, catalog-page { display: block; min-height: 100vh; }
    ::view-transition-old(root), ::view-transition-new(root) {
      animation-duration: 180ms;
      animation-timing-function: ease-out;
    }
    @media (prefers-reduced-motion: reduce) {
      ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
    }
    html[data-components-pending] :is(skill-page, catalog-page):not(:defined) {
      visibility: hidden;
    }
  </style>
  <script>
    // Run before first paint; component styles are applied synchronously on upgrade.
    (() => {
      const root = document.documentElement;
      try {
        const theme = localStorage.getItem('automata-skill-site-theme');
        if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
      } catch { /* Storage is optional. */ }
      root.setAttribute('data-components-pending', '');
      // Failed/blocked modules must not leave server-rendered content invisible.
      setTimeout(() => root.removeAttribute('data-components-pending'), 4000);
    })();
  </script>
  <script type="module" src="/templates/{% block module %}skill{% endblock %}.css.js"></script>
  <script type="module" src="/templates/components/live-refresh.js"></script>
  <script type="module" src="/templates/components/navigation.js"></script>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
