{% extends "_base.html" %}
{% block content %}
<automata-app class="app-shell">
<a class="skip-link" href="#conversation">Skip to conversation</a>
  <header class="app-header">
    <div><span class="eyebrow">AUTOMATA</span><h1>Conversation</h1></div>
    <status-badge role="status" aria-live="polite"><span id="connection-status">Connecting…</span></status-badge>
  </header>
  <main class="workspace">
    <section class="chat-panel" aria-label="Chat">
      <div class="panel-heading"><div><span class="eyebrow">SESSION</span><h2 id="conversation">Chat</h2></div><span id="run-status" role="status" aria-live="polite">Starting…</span></div>
      <div id="transcript" class="transcript" role="log" aria-label="Conversation messages" aria-live="polite" aria-relevant="additions text">
        <p class="empty-state">Start a conversation. Replies will appear here as they arrive.</p>
      </div>
      <form id="composer" class="composer">
        <label for="prompt">Message</label>
        <textarea id="prompt" name="prompt" rows="3" placeholder="Write a message…" required></textarea>
        <div class="composer-actions"><p>Enter to send · Shift+Enter for a new line</p><div><button id="stop" type="button" disabled>Stop</button><button id="send" type="submit" disabled>Send</button></div></div>
      </form>
    </section>
  </main>
</automata-app>
<native-rpc-dialog></native-rpc-dialog>
{% endblock %}
{% block scripts %}<script src="/bridge.js"></script><script type="module" src="/assets/index.js"></script>{% endblock %}
